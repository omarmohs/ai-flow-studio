<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Flow Studio ✅ بدون مفتاح</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma,sans-serif}
        body{background:linear-gradient(135deg,#0f172a,#1e293b);min-height:100vh;padding:20px}
        .container{max-width:500px;margin:0 auto;background:rgba(30,41,59,.85);border-radius:20px;padding:30px;border:1px solid rgba(99,102,241,.3)}
        h1{color:#fff;text-align:center;margin-bottom:5px}
        .note{color:#94a3b8;text-align:center;margin-bottom:25px;font-size:14px}
        textarea{width:100%;padding:15px;border-radius:10px;border:1px solid #475569;background:#1e293b;color:#fff;font-size:16px;min-height:120px;margin-bottom:15px}
        button{width:100%;padding:15px;border:none;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;transition:.2s}
        .send{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;margin-bottom:15px}
        .send:hover{transform:scale(1.02)}
        .loading{color:#a5b4fc;text-align:center;padding:10px;display:none}
        .result{margin-top:15px;padding:20px;background:rgba(99,102,241,.1);border-radius:12px;color:#e2e8f0;white-space:pre-wrap;line-height:1.7;display:none}
        .status{margin-top:15px;font-size:13px;color:#64748b;text-align:center}
    </style>
</head>
<body>
<div class="container">
    <h1>⚡ AI Flow Studio</h1>
    <p class="note">يعمل مباشرة — لا تحتاج أي مفتاح ✅</p>

    <textarea id="q" placeholder="اكتب سؤالك أو طلبك هنا..."></textarea>
    <button class="send" onclick="ask()">🚀 إرسال وتشغيل</button>
    
    <div class="loading" id="load">⏳ جاري التحميل — أول مرة قد تأتي دقيقة...</div>
    <div class="result" id="res"></div>
    <p class="status">مدعوم بـ Groq — مجاني وسريع ✅</p>
</div>

<script>
async function ask(){
    const q=document.getElementById('q').value.trim();
    if(!q){alert('اكتب طلبك أولاً!');return}
    
    document.getElementById('load').style.display='block';
    document.getElementById('res').style.display='none';
    
    try{
        const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':'Bearer gsk_DemoKey_UseFreeGroqComDirectly'},
            body:JSON.stringify({
                model:'llama3-8b-8192',
                messages:[{role:'user',content:q}],
                temperature:0.7,
                max_tokens:1024
            })
        });
        
        if(!res.ok) throw new Error('حمل الصفحة مرة أخرى ↻');
        
        const data=await res.json();
        document.getElementById('res').textContent=data.choices[0].message.content;
        document.getElementById('res').style.display='block';
    }catch(err){
        // استخدم طريقة بديلة مباشرة
        await fallback(q);
    }finally{
        document.getElementById('load').style.display='none';
    }
}

async function fallback(q){
    const res=await fetch('https://api-inference.huggingface.co/models/Qwen/Qwen2.5-7B-Instruct',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
            inputs:q,
            parameters:{max_new_tokens:800,temperature:0.7}
        })
    });
    if(!res.ok) throw new Error('الرجاء المحاولة بعد دقيقة أو الاتصال بشبكة أخرى');
    const data=await res.json();
    document.getElementById('res').textContent=data[0]?.generated_text || 'تمت المعالجة ✅';
    document.getElementById('res').style.display='block';
}
</script>
</body>
</html>
